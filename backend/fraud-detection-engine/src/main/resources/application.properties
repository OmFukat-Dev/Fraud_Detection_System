# ============================
#   Application
# ============================
spring.application.name=fraud-detection-engine
server.port=8080

# ============================
#   MySQL DataSource
# ============================
spring.datasource.url=jdbc:mysql://localhost:3307/frauddb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=frauduser
spring.datasource.password=fraudpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
#   JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================
#   Redis
# ============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# ============================
#   Kafka
# ============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=fraud-detection-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ============================
#   Kafka Topics
# ============================
app.kafka.topic.transactions=fraud.transactions.raw

# ============================
#   JWT
# ============================
# Base64-encoded 256-bit secret key (generate with: openssl rand -base64 32)
app.jwt.secret=ZnJhdWRkZXRlY3Rpb25zeXN0ZW1zZWNyZXRrZXkxMjM0NTY3OA==
app.jwt.expiration-ms=86400000

# ============================
#   Actuator
# ============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# ============================
#   Logging
# ============================
logging.level.com.fraud=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.security=INFO
app.kafka.topic.alerts=fraud.alerts

# ============================
#   ML Scoring Service
# ============================
app.ml.enabled=true
app.ml.base-url=http://localhost:8000
app.ml.timeout-ms=500
app.ml.rule-weight=0.6
app.ml.model-weight=0.4
