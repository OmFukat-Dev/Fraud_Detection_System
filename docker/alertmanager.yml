global:
  resolve_timeout: 5m

route:
  receiver: null-receiver
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers:
        - severity="critical"
      receiver: email-and-slack
      continue: true
    - matchers:
        - severity="warning"
      receiver: email-only

receivers:
  - name: null-receiver
  - name: email-only
    email_configs:
      - to: alerts@example.com
        from: fraud-alerts@example.com
        smarthost: smtp.example.com:587
        auth_username: alerts@example.com
        auth_password: change-me
        send_resolved: true
  - name: email-and-slack
    email_configs:
      - to: alerts@example.com
        from: fraud-alerts@example.com
        smarthost: smtp.example.com:587
        auth_username: alerts@example.com
        auth_password: change-me
        send_resolved: true
    slack_configs:
      - api_url: https://hooks.slack.com/services/REPLACE/ME
        channel: '#fraud-alerts'
        send_resolved: true
