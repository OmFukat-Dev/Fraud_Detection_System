global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'fraud-detection-engine'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['fraud-detection-backend:8080']
        labels:
          application: 'fraud-detection-engine'

  - job_name: 'kafka'
    static_configs:
      - targets: ['fraud-kafka:9092']

