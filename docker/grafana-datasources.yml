apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "5s"
      queryTimeout: "60s"
      httpMethod: "POST"
    secureJsonData: {}

  - name: FraudDetectionEngine
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    database: "fraud-detection-engine"
    jsonData:
      timeInterval: "5s"
      httpMethod: "POST"
    secureJsonData: {}
