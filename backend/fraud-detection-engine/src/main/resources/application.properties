# ============================
#   Application
# ============================
spring.application.name=fraud-detection-engine
server.port=${SERVER_PORT:8080}

# ============================
#   MySQL DataSource
# ============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/frauddb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:frauduser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fraudpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
#   JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================
#   Flyway Migrations
# ============================
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}

# ============================
#   Redis
# ============================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2000ms}

# ============================
#   Kafka
# ============================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:fraud-detection-group}
spring.kafka.consumer.auto-offset-reset=${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ============================
#   Kafka Topics
# ============================
app.kafka.topic.transactions=${APP_KAFKA_TOPIC_TRANSACTIONS:fraud.transactions.raw}
app.kafka.topic.alerts=${APP_KAFKA_TOPIC_ALERTS:fraud.alerts}

# ============================
#   JWT
# ============================
# Base64-encoded 256-bit secret key (generate with: openssl rand -base64 32)
app.jwt.secret=${APP_JWT_SECRET:dev-only-jwt-secret-change-me}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ============================
#   Actuator
# ============================
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
management.metrics.export.prometheus.enabled=${MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED:true}

# ============================
#   Logging
# ============================
logging.level.com.fraud=${LOGGING_LEVEL_COM_FRAUD:DEBUG}
logging.level.org.springframework.kafka=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}

# ============================
#   ML Scoring Service
# ============================
app.ml.enabled=${APP_ML_ENABLED:true}
app.ml.base-url=${APP_ML_BASE_URL:http://localhost:8000}
app.ml.timeout-ms=${APP_ML_TIMEOUT_MS:500}
app.ml.rule-weight=${APP_ML_RULE_WEIGHT:0.6}
app.ml.model-weight=${APP_ML_MODEL_WEIGHT:0.4}
app.fraud.rules.velocity-max-count=${APP_FRAUD_RULES_VELOCITY_MAX_COUNT:5}
app.fraud.rules.velocity-window-minutes=${APP_FRAUD_RULES_VELOCITY_WINDOW_MINUTES:5}
app.fraud.rules.high-amount-threshold=${APP_FRAUD_RULES_HIGH_AMOUNT_THRESHOLD:50000}
app.fraud.rules.blacklisted-ips=${APP_FRAUD_RULES_BLACKLISTED_IPS:}
app.fraud.rules.blacklisted-merchants=${APP_FRAUD_RULES_BLACKLISTED_MERCHANTS:}
app.fraud.rules.geo-anomaly-distance-km=${APP_FRAUD_RULES_GEO_ANOMALY_DISTANCE_KM:500}
app.fraud.rules.geo-anomaly-time-minutes=${APP_FRAUD_RULES_GEO_ANOMALY_TIME_MINUTES:30}
app.ml.circuit-breaker.failure-threshold=${APP_ML_CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
app.ml.circuit-breaker.open-duration-ms=${APP_ML_CIRCUIT_BREAKER_OPEN_DURATION_MS:30000}

server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
app.rate-limit.api.capacity=${APP_RATE_LIMIT_API_CAPACITY:120}
app.rate-limit.api.refill-tokens=${APP_RATE_LIMIT_API_REFILL_TOKENS:120}
app.rate-limit.api.refill-period-seconds=${APP_RATE_LIMIT_API_REFILL_PERIOD_SECONDS:60}
app.rate-limit.login.capacity=${APP_RATE_LIMIT_LOGIN_CAPACITY:10}
app.rate-limit.login.refill-tokens=${APP_RATE_LIMIT_LOGIN_REFILL_TOKENS:10}
app.rate-limit.login.refill-period-seconds=${APP_RATE_LIMIT_LOGIN_REFILL_PERIOD_SECONDS:300}
app.login.bruteforce.failure-threshold=${APP_LOGIN_BRUTE_FORCE_FAILURE_THRESHOLD:5}
app.login.bruteforce.failure-window-minutes=${APP_LOGIN_BRUTE_FORCE_FAILURE_WINDOW_MINUTES:15}
app.login.bruteforce.lockout-minutes=${APP_LOGIN_BRUTE_FORCE_LOCKOUT_MINUTES:15}
