version: '3.9'

services:

 mysql:
 image: mysql:8
 container_name: fraud-mysql
 environment:
 MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
 MYSQL_DATABASE: ${MYSQL_DATABASE:-frauddb}
 MYSQL_USER: ${MYSQL_USER:-frauduser}
 MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fraudpass}
 ports:
 - '${MYSQL_HOST_PORT:-3307}:3306'
 volumes:
 - mysql-data:/var/lib/mysql
 healthcheck:
 test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
 interval: 10s
 timeout: 5s
 retries: 5

 redis:
 image: redis:7
 container_name: fraud-redis
 ports:
 - '${REDIS_HOST_PORT:-6379}:6379'
 healthcheck:
 test: ['CMD', 'redis-cli', 'ping']
 interval: 10s
 timeout: 5s
 retries: 3

 zookeeper:
 image: confluentinc/cp-zookeeper:7.5.0
 container_name: fraud-zookeeper
 environment:
 ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
 ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME:-2000}
 ports:
 - '${ZOOKEEPER_HOST_PORT:-2181}:2181'

 kafka:
 image: confluentinc/cp-kafka:7.5.0
 container_name: fraud-kafka
 depends_on:
 - zookeeper
 ports:
 - '${KAFKA_HOST_PORT:-9092}:9092'
 environment:
 KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
 KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
 KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
 KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
 KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}
 KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-4}
 healthcheck:
 test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'localhost:9092']
 interval: 15s
 timeout: 10s
 retries: 5

 ml-service:
 build:
 context: ../ml-service
 container_name: fraud-ml-service
 ports:
 - '${ML_SERVICE_HOST_PORT:-8000}:8000'
 healthcheck:
 test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
 interval: 30s
 timeout: 10s
 retries: 3

 prometheus:
 image: prom/prometheus:latest
 container_name: fraud-prometheus
 ports:
 - '${PROMETHEUS_HOST_PORT:-9090}:9090'
 volumes:
 - ./prometheus.yml:/etc/prometheus/prometheus.yml
 - ./alert.rules.yml:/etc/prometheus/rules/alert.rules.yml
 - prometheus-data:/prometheus
 depends_on:
 - kafka
 command:
 - '--config.file=/etc/prometheus/prometheus.yml'
 - '--storage.tsdb.path=/prometheus'
 - '--web.console.libraries=/etc/prometheus/console_libraries'
 - '--web.console.templates=/etc/prometheus/consoles'
 - '--storage.tsdb.retention.time=200h'
 - '--web.enable-lifecycle'
 - '--web.external-url=https://fraud-detection.example.com/prometheus/'
 - '--web.route-prefix=/prometheus'

 alertmanager:
 image: prom/alertmanager:latest
 container_name: fraud-alertmanager
 ports:
 - '${ALERTMANAGER_HOST_PORT:-9093}:9093'
 volumes:
 - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
 - alertmanager-data:/alertmanager
 command:
 - '--config.file=/etc/alertmanager/alertmanager.yml'
 - '--storage.path=/alertmanager'

 grafana:
 image: grafana/grafana:latest
 container_name: fraud-grafana
 ports:
 - '${GRAFANA_HOST_PORT:-3001}:3000'
 environment:
 GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
 GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
 GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
 GF_SERVER_ROOT_URL: https://fraud-detection.example.com/grafana/
 GF_SERVER_SERVE_FROM_SUBPATH: 'true'
 volumes:
 - grafana-data:/var/lib/grafana
 - ./grafana-dashboard.json:/etc/grafana/provisioning/dashboards/fraud-detection.json
 - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
 depends_on:
 - prometheus

 nginx:
 build:
 context: ./nginx
 container_name: fraud-nginx
 ports:
 - '${NGINX_HTTP_HOST_PORT:-80}:80'
 - '${NGINX_HTTPS_HOST_PORT:-443}:443'
 volumes:
 - ./nginx.conf:/etc/nginx/nginx.conf:ro
 - ../frontend/dist:/usr/share/nginx/html:ro
 - certbot-www:/var/www/certbot:ro
 - certbot-conf:/etc/letsencrypt
 depends_on:
 - fraud-detection-backend
 - ml-service
 - grafana
 restart: unless-stopped

 certbot:
 image: certbot/certbot:latest
 container_name: fraud-certbot
 volumes:
 - certbot-www:/var/www/certbot
 - certbot-conf:/etc/letsencrypt
 command: certonly --webroot --webroot-path=/var/www/certbot --email admin@example.com --agree-tos --no-eff-email -d fraud-detection.example.com

 fraud-detection-backend:
 build:
 context: ../backend/fraud-detection-engine
 dockerfile: Dockerfile
 container_name: fraud-detection-backend
 ports:
 - '8080:8080'
 environment:
 SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
 SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-frauduser}
 SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-fraudpass}
 SPRING_JPA_HIBERNATE_DDL_AUTO: validate
 SPRING_DATA_REDIS_HOST: redis
 SPRING_DATA_REDIS_PORT: 6379
 SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
 APP_ML_BASE_URL: http://ml-service:8000
 MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
 depends_on:
 mysql:
 condition: service_healthy
 redis:
 condition: service_healthy
 kafka:
 condition: service_healthy
 ml-service:
 condition: service_healthy
 healthcheck:
 test: ['CMD', 'curl', '-f', 'http://localhost:8080/actuator/health']
 interval: 30s
 timeout: 10s
 retries: 3
 restart: unless-stopped

volumes:
 mysql-data:
 grafana-data:
 prometheus-data:
 alertmanager-data:
 certbot-www:
 certbot-conf:
